[workspace]
resolver = "3"
members = ["crates/index", "crates/cli", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
rubyscope-index = { path = "crates/index" }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
ignore = "0.4"
memmap2 = "0.9"
rayon = "1.12"
regex = "1.13"
ruby-prism = "1.9.0"
postcard = { version = "1.1", features = ["use-std"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tikv-jemallocator = "0.6"

[profile.release]
debug = 1

[profile.dev.package."*"]
opt-level = 2
