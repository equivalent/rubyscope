server {
    listen 80;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript text/javascript image/svg+xml;

    # Health check for kamal-proxy.
    location = /up {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Images and fonts change rarely. A day of caching is enough.
    location ~* \.(webp|png|jpg|jpeg|svg|ico|ttf|woff2?)$ {
        add_header Cache-Control "public, max-age=86400";
    }

    # The pages, the CSS and the JS are checked on every load, so a new deploy shows at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
